name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests & checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Syntax check (all JavaScript)
        run: npm run check-syntax
      - name: Version & changelog consistency
        run: npm run check-release
      - name: Repository hygiene (no brand artwork, local presets or saved data)
        run: npm run check-hygiene
      - name: Sample quiz is loadable
        run: node -e "require('./src/shared/logic').normalizeState(require('./examples/sample-quiz.json'))"

  smoke:
    name: App smoke, effects & autosave (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    # Windows and macOS runs are new and could not be tried locally; they report but do not block until proven.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, experimental: false }
          - { os: windows-latest, experimental: true }
          - { os: macos-latest, experimental: true }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install display & runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libasound2t64 libgbm1 libnss3 libgtk-3-0t64
      - name: Run the real app through scripted scenarios (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run ci:smoke
      - name: Run the real app through scripted scenarios
        if: runner.os != 'Linux'
        run: npm run ci:smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-screenshots-${{ matrix.os }}
          path: smoke-out
          retention-days: 7

  build:
    name: Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          retention-days: 7
