name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests & checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Syntax check (all JavaScript)
        run: find . -name '*.js' -not -path './node_modules/*' -not -path './dist/*' -print0 | xargs -0 -n1 node --check
      - name: Version & changelog consistency
        run: npm run check-release
      - name: Repository hygiene (no brand artwork, local presets or saved data)
        run: npm run check-hygiene
      - name: Sample quiz is loadable
        run: node -e "require('./src/shared/logic').normalizeState(require('./examples/sample-quiz.json'))"

  smoke:
    name: Headless app smoke & autosave tests
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install display & runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libasound2t64 libgbm1 libnss3 libgtk-3-0t64
      - name: Run the app through a scripted scenario
        run: |
          mkdir -p "$RUNNER_TEMP/profile"
          cp examples/sample-quiz.json "$RUNNER_TEMP/profile/quiz.json"
          PUBQUIZ_DEV_SCENARIO=scripts/ci/smoke.json PUBQUIZ_DEV_OUT=smoke-out \
            xvfb-run -a npx electron . --no-sandbox --disable-gpu --user-data-dir="$RUNNER_TEMP/profile"
      - name: Verify screenshots and console output
        run: node scripts/ci/check-smoke.js smoke-out
      - name: Autosave survives a hard kill (SIGKILL → restart → nothing lost)
        run: xvfb-run -a node scripts/ci/autosave-e2e.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke-out
          retention-days: 7

  build:
    name: Build AppImage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
          retention-days: 7
